<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;position:relative">
<svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block;overflow:visible">
<defs>
<filter id="gmglow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="9" result="b"></feGaussianBlur>
<feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
</filter>
<radialGradient id="gmfade" cx="50%" cy="50%" r="50%">
<stop offset="0.4" stop-color="#ffffff"></stop>
<stop offset="0.62" stop-color="#7d7d7d"></stop>
<stop offset="0.95" stop-color="#000000"></stop>
</radialGradient>
<mask id="gmmask"><rect x="0" y="0" width="1000" height="1000" fill="url(#gmfade)"></rect></mask>
</defs>
<sc-if value="{{ ambient }}" hint-placeholder-val="{{ false }}">
<g mask="url(#gmmask)">
<g stroke="#4a525c" stroke-width="6" fill="none" opacity="0.9">
<path d="M150 160 L400 300"></path>
<path d="M500 120 L560 300"></path>
<path d="M820 180 L660 300"></path>
<path d="M880 520 L620 420"></path>
<path d="M760 820 L640 640"></path>
<path d="M200 860 L360 640"></path>
<path d="M120 520 L330 420"></path>
<path d="M300 700 L360 640"></path>
<path d="M150 160 L120 520"></path>
<path d="M820 180 L880 520"></path>
<path d="M500 120 L820 180"></path>
<path d="M200 860 L300 700"></path>
</g>
<g fill="#8b949e" opacity="0.9">
<circle cx="150" cy="160" r="14"></circle>
<circle cx="500" cy="120" r="12"></circle>
<circle cx="820" cy="180" r="14"></circle>
<circle cx="880" cy="520" r="13"></circle>
<circle cx="760" cy="820" r="14"></circle>
<circle cx="200" cy="860" r="13"></circle>
<circle cx="120" cy="520" r="12"></circle>
<circle cx="300" cy="700" r="14"></circle>
</g>
</g>
</sc-if>
<g filter="url(#gmglow)">
<g stroke="#4ef08c" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M560 300 L400 300 L330 420 L400 540 L560 540 L620 420 Z"></path>
<path d="M620 420 L660 300"></path>
<path d="M620 420 L640 640 L500 710 L360 640"></path>
</g>
<g fill="#4ef08c">
<circle cx="560" cy="300" r="22"></circle>
<circle cx="400" cy="300" r="22"></circle>
<circle cx="330" cy="420" r="22"></circle>
<circle cx="620" cy="420" r="22"></circle>
<circle cx="400" cy="540" r="22"></circle>
<circle cx="560" cy="540" r="22"></circle>
<circle cx="640" cy="640" r="22"></circle>
<circle cx="500" cy="710" r="22"></circle>
<circle cx="360" cy="640" r="22"></circle>
<circle cx="660" cy="300" r="18"></circle>
</g>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:240},&quot;ambient&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}"></script>
</body>
</html>
