<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%">
<svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;mask-image:radial-gradient(circle at 50% 50%,#000 42%,rgba(0,0,0,0.55) 72%,transparent 96%);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 42%,rgba(0,0,0,0.55) 72%,transparent 96%)">
<sc-for list="{{ edges }}" as="e" hint-placeholder-count="0">
<line x1="{{ e.x1 }}" y1="{{ e.y1 }}" x2="{{ e.x2 }}" y2="{{ e.y2 }}" stroke="#4a525c" stroke-width="2"></line>
</sc-for>
<sc-for list="{{ nodes }}" as="n" hint-placeholder-count="0">
<circle cx="{{ n.x }}" cy="{{ n.y }}" r="{{ n.r }}" fill="#8b949e"></circle>
</sc-for>
<sc-if value="{{ hasLit }}" hint-placeholder-val="{{ false }}">
<circle cx="{{ lit.x }}" cy="{{ lit.y }}" r="9" fill="#4ef08c"></circle>
</sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:400},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:26,&quot;tsType&quot;:&quot;number&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;},&quot;lit&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const count = this.props.count ?? 26;
    let s = (this.props.seed ?? 7) * 9301 + 49297;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const nodes = [];
    for (let i = 0; i < count; i++) nodes.push({ x: Math.round(rnd() * 980) + 10, y: Math.round(rnd() * 980) + 10, r: 4 + Math.round(rnd() * 4) });
    const edges = [];
    nodes.forEach((n, i) => {
      nodes.map((m, j) => ({ j, d: Math.hypot(m.x - n.x, m.y - n.y) }))
        .filter(o => o.j !== i).sort((a, b) => a.d - b.d).slice(0, 2)
        .forEach(o => { if (o.j > i) edges.push({ x1: n.x, y1: n.y, x2: nodes[o.j].x, y2: nodes[o.j].y }); });
    });
    const hasLit = !!this.props.lit;
    return { nodes, edges, hasLit, lit: nodes[Math.floor(count / 3)] };
  }
}
</script>
</body>
</html>
